name: frontend

# Path-filtered: a change to the resolver must not run vitest, and vice versa.
# The two projects are independent, and CI reflects that.
on:
  push:
    branches: [main]
    paths:
      - 'continuum-fe/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'continuum-fe/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: continuum-fe

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: continuum-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` runs `tsc -b` before vite, so this is the typecheck too.
      - name: Build
        run: npm run build

      # jsdom only — no browser, no backend. The SSE parser and the inbox
      # verdicts are pure enough to test without either.
      - name: Test
        run: npm test
