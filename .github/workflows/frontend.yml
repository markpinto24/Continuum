name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'continuum-fe/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'continuum-fe/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: continuum-fe

    steps:
      - uses: actions/checkout@v4

      # continuum-fe is a Phase 4 placeholder holding only a README. Until it is
      # scaffolded, every real step is gated on package.json existing, so this
      # workflow passes green instead of failing on a missing lockfile. Delete
      # the guard — not the steps — once the app lands.
      - name: Detect project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::continuum-fe is not scaffolded yet (Phase 4) — nothing to build."
          fi

      - name: Setup Node
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: continuum-fe/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.ready == 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.ready == 'true'
        run: npm run lint --if-present

      - name: Build
        if: steps.detect.outputs.ready == 'true'
        run: npm run build --if-present

      - name: Test
        if: steps.detect.outputs.ready == 'true'
        run: npm test --if-present
