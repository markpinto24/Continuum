name: backend

# Path-filtered: a change to the graph UI must not run pytest, and vice versa.
# The two projects are independent, and CI reflects that.
on:
  push:
    branches: [main]
    paths:
      - 'continuum-be/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'continuum-be/**'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: continuum-be

    # Only for the Postgres-only tests. Everything else runs on in-memory SQLite
    # and Qdrant; this is here because SQLite cannot show a write race — and the
    # first-admin race is a real bug it once hid.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: continuum
          POSTGRES_PASSWORD: continuum
          POSTGRES_DB: continuum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U continuum -d continuum_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # The lockfile lives in the project, not at the repo root.
          cache-dependency-glob: continuum-be/uv.lock

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      # The integration tests run against AsyncQdrantClient(":memory:") with a
      # stubbed LLM — real Qdrant indexing and cosine scores without a model —
      # and apply the real Alembic migrations to in-memory SQLite. With
      # TEST_DATABASE_URL set, the Postgres-only tests run too instead of skipping.
      - name: Test
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://continuum:continuum@localhost:5432/continuum_test
        run: uv run pytest
