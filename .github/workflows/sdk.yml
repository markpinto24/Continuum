name: sdk

# Path-filtered like backend.yml and frontend.yml: the SDK is its own project,
# tied to the backend only by the HTTP contract, so it runs only when it changes.
on:
  push:
    branches: [main]
    paths:
      - 'continuum-sdk/**'
      - '.github/workflows/sdk.yml'
  pull_request:
    paths:
      - 'continuum-sdk/**'
      - '.github/workflows/sdk.yml'

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: continuum-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: continuum-sdk/uv.lock

      - name: Install dependencies
        run: uv sync --extra mcp --extra dev

      - name: Lint
        run: uv run ruff check .

      # The client against a mock transport, the MCP tools through MCPServer:
      # no Continuum, no model.
      - name: Test
        run: uv run pytest
