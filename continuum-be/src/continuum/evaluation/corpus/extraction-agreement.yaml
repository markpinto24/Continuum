# =============================================================================
# Found in use (2026-10-22): an agreement stored as "this workout"
# Labelled before the fix was written. Live, "keep this workout as my active
# current workout" was stored as "The user keeps this workout as their active
# current workout" — true, and useless: asked later what the split was, the
# assistant could not say.
# =============================================================================

- id: ref-keep-this-workout
  mode: personal
  why: >
    The live case. "This workout" must be written out as the split it refers to
    — its days, in order — not the exercises. A memory that says "this" can never
    answer "what is my split?".
  context: >
    Here's a 6-day split, about 2 hours a session. Day 1 Push: bench, incline
    dumbbell press, shoulder press. Day 2 Pull: deadlifts, rows, curls. Day 3
    Legs: squats, leg press, calves. Day 4 Full body: compound lifts. Day 5 Push.
    Day 6 Pull. Day 7 rest.
  text: keep this workout as my active current workout
  # Relabelled 2026-11-02, by decision, not by result: an explicit keep stores
  # the plan in full (Iteration 10). Was: "follows a 6-day split of push, pull,
  # legs, full body, push and pull".
  expect:
    - content: The user follows a 6-day split - push (bench, incline dumbbell press, shoulder press), pull (deadlifts, rows, curls), legs (squats, leg press, calves), full body compound lifts, push, pull, then a rest day
      category: routine
      subject: gym
  forbid:
    - The user keeps this workout as their active current workout
  tags: [reference, found-in-use]

