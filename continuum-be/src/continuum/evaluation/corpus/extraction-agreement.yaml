- id: work-agree-db
  mode: workspace
  why: >
    The work version of a clear yes: the recommendation becomes the decision.
  context: >
    For the Atlas event store I'd use Postgres with JSONB rather than MongoDB,
    since you need transactions across aggregates.
  text: sounds good, let's go with Postgres
  expect:
    - content: Atlas uses Postgres for its event store
      category: decision
      subject: atlas
  tags: [clear-yes, workspace]

- id: work-maybe
  mode: workspace
  why: >
    Not decided — pending, raised when release cadence comes up.
  context: >
    You could move the release cadence from weekly to every two weeks.
  text: I'll think about it
  expect:
    - content: The team is considering releasing every two weeks
      category: decision
      tentative: true
  tags: [maybe, workspace]

- id: work-no-own-decision
  mode: workspace
  why: >
    A no that states the user's own decision. The suggestion is not recorded;
    the decision, in the user's words, is.
  context: >
    Consider switching CI from Jenkins to GitHub Actions.
  text: no, we're staying on Jenkins
  expect:
    - content: The team is staying on Jenkins for CI
      category: decision
      subject: ci
  forbid:
    - The team switched CI to GitHub Actions
  tags: ["no", own-words, workspace]

- id: work-echo-owner
  mode: workspace
  why: >
    The answer repeats who owns billing (from memory). The user adopts the
