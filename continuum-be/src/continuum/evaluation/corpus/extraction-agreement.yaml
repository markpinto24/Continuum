# =============================================================================
# Iteration 10 (2026-11-02) — labelled before the first run.
# A reply that borrows a detail from the answer it replies to (found in use
# 2026-10-28), and an explicit keep of a plan — decided 2026-11-02: kept in full.
# =============================================================================

- id: borrowed-routine-number
  mode: personal
  why: >
    Found in use. The answer's "four-day split" came from memory; the reply
    states a different routine with no number. The extractor wrote "follows a
    four-day workout split with push pull legs...", three runs in three, and the
    duplicate shortcut folded it into the stale four-day belief. The routine is
    the user's; the number is not. (Read the output: the number is the point.)
  context: >
    Based on your last confirmed information, you follow a four-day workout
    split [1]. This means you have structured your workouts over four days of
    the week, with specific muscle groups targeted each day.
  text: i do push pull legs upper lower arms workout
  expect:
    - content: The user does a push, pull, legs, upper, lower and arms workout split
      category: routine
      subject: workout
  forbid:
    - The user follows a four-day workout split
  tags: [held-out, borrowed, found-in-use]

- id: borrowed-run-distance
  mode: personal
  why: >
    The same shape with a distance. "5 km" came from memory; the reply changes
    only when. "Runs 5 km in the evenings" would be a guess told as their word.
  context: >
    You mentioned you run 5 km every morning [1]. Would you like a plan to build
    up to 10 km?
  text: i run in the evenings now
  expect:
    - content: The user runs in the evenings
      category: routine
      subject: running
  # No forbid: "runs 5 km in the evenings" shares enough tokens with the right
  # answer that token matching flagged it on every run, before and after (the
  # number is invisible to it). Read the output.
  tags: [held-out, borrowed]

- id: borrowed-team-size-work
