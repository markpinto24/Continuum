    category: fact
    subject: team
    age_days: 90
  incoming:
    content: The team tracks bugs in Linear
    category: fact
    subject: team
  expect: escalate
  tags: [partial-scope, fact]

- id: ownership-handover-or-shared
  why: >
    One service, two named owners. A handover and a co-ownership look identical
    at this level of detail, and guessing handover silently erases a real owner.
  existing:
    content: Sara owns the billing service
    category: person
    subject: billing-service
    age_days: 100
  incoming:
    content: Raj owns the billing service
    category: person
    subject: billing-service
  expect: escalate
  tags: [ownership, person, flagship]

- id: rule-with-exception
  why: >
    The exception falsifies the original as written ("all deploys") without
