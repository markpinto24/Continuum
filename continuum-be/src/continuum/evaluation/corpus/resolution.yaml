# =============================================================================
# known gaps — expected to fail today. Kept so the number is honest.
# =============================================================================

- id: role-contested-via-person-subject
  why: >
    The same contest as `ownership-handover-or-shared`, but the extractor keyed
    the subject to the person rather than the service. Different subjects, so the
    cheap filter routes it to `store` and the dispute is never raised. The filter
    is doing what it was designed to do; the design has a blind spot when the
    contested thing is a role and the subject is a person.
  existing:
    content: Sara leads the data platform
    category: person
    subject: sara
    age_days: 200
  incoming:
    content: Raj leads the data platform
    category: person
    subject: raj
  expect: escalate
  tags: [known-gap, subject-filter, person]

- id: constraint-contested-across-subjects
  why: >
    A company-wide cap and a project cap are the same constraint at different
    scopes, but the subjects differ, so the filter separates them and no dispute
    is raised. Cross-scope contradiction is not something subject filtering can
    see.
  existing:
    content: No project may exceed 5k per month
    category: constraint
    subject: company
    age_days: 90
  incoming:
    content: Atlas is budgeted at 9k per month
    category: constraint
    subject: atlas
  expect: escalate
  tags: [known-gap, subject-filter, constraint]

- id: implicit-reversal-without-naming
  why: >
    A reversal that never names what it replaces and shares little vocabulary
    with it. If the embedding does not put these in the conflict band, the
    resolver never sees a candidate and the stale belief survives at full
    confidence. This case measures retrieval reach, not judgement.
  existing:
    content: Atlas stores events in Postgres
    category: decision
    subject: atlas
    age_days: 60
  incoming:
    content: The team is standardising on a document store for Atlas
    category: decision
    subject: atlas
  expect: retire
  tags: [known-gap, retrieval-reach, hard]

