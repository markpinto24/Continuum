# Labelled contradiction corpus.
#
# Every case carries a `why`. A label without a rationale is a guess, and a
# corpus of guesses will happily certify a broken gate.
#
# Labels are ACTIONS, not verdicts — see evaluation/types.py for why.
#
#   retire     the old belief is superseded without asking
#   escalate   the pair goes to the contradiction inbox
#   reinforce  the fact is already known; confirm it, store nothing
#   store      store the fact, touch nothing
#
# The single labelling principle: the incoming fact is always the later one, by
# construction — it is being ingested now. So a plain reversal IS a supersede,
# and "the timing is unclear" is not on its own a reason to escalate. What earns
# an escalation is *partial overlap*: when some of the old belief survives and a
# human has to say how much.
#
# Cases tagged `known-gap` are ones the system is expected to get wrong today.
# They are here deliberately. A corpus containing only passes measures nothing.

# =============================================================================
# retire — a belief was genuinely replaced
# =============================================================================

- id: db-swap-explicit
  why: >
    Same subject, same slot, flatly incompatible storage engines. Only one can be
    the event store, and the incoming statement is the later one. This is the
    case the whole supersede path exists for; if it does not retire here, the
    gate is too high.
  existing:
    content: Atlas stores events in Postgres
    category: decision
    subject: atlas
    age_days: 60
  incoming:
    content: Atlas stores events in MongoDB
    category: decision
    subject: atlas
  expect: retire
  tags: [reversal, decision]

- id: comms-preference-flip
  why: >
    An explicit reversal of a stated preference, with the old position named in
    the new statement. A person cannot simultaneously prefer calls and prefer not
    to have them.
  existing:
    content: Acme prefers a weekly status call
    category: preference
    subject: acme
    age_days: 90
  incoming:
    content: Acme prefers written async updates instead of calls
    category: preference
    subject: acme
  expect: retire
  tags: [reversal, preference]

- id: budget-cap-raised
  why: >
    A cap is a single number. 5k and 8k cannot both be the cap, and no scope
    qualifier distinguishes them.
  existing:
    content: Acme's budget is capped at 5k per month
    category: constraint
    subject: acme
    age_days: 45
  incoming:
    content: Acme's budget is capped at 8k per month
    category: constraint
    subject: acme
  expect: retire
  tags: [reversal, constraint]

- id: runtime-migration
  why: >
    A service runs on one orchestrator at a time. The statement replaces a stable
    fact about the world rather than adding to it.
  existing:
    content: The billing service runs on ECS
    category: fact
    subject: billing-service
    age_days: 120
  incoming:
    content: The billing service runs on EKS
    category: fact
    subject: billing-service
  expect: retire
  tags: [reversal, fact]

- id: role-change-explicit
  why: >
    The incoming statement says outright that the old arrangement ended. Without
    the "has moved off" clause this would be co-ownership and therefore an
    escalation — the explicitness is what makes it safe to apply.
  existing:
    content: Sara leads the data platform
    category: person
    subject: sara
    age_days: 200
  incoming:
    content: Sara has moved off the data platform and now leads infrastructure
    category: person
    subject: sara
  expect: retire
  tags: [reversal, person]

- id: deadline-moved
  why: >
    A launch date is a single value and the new one is stated as a move. Note the
    category is constraint, not event — the launch has not happened, so nothing
    here is immutable history.
  existing:
    content: The Atlas launch is set for 14 March
    category: constraint
    subject: atlas
    age_days: 30
  incoming:
    content: The Atlas launch has moved to 2 April
    category: constraint
    subject: atlas
  expect: retire
  tags: [reversal, constraint]

- id: vendor-dropped
  why: >
    "Dropped X and moved in-house" names the thing it replaces. Nothing of the
    original decision survives.
  existing:
    content: Chose Auth0 for authentication to save build time
    category: decision
    subject: auth
    age_days: 150
  incoming:
    content: Dropped Auth0 and moved authentication in-house
    category: decision
    subject: auth
  expect: retire
  tags: [reversal, decision]

# =============================================================================
# escalate — partial overlap; a human decides how much of the old belief lives
# =============================================================================

- id: narrowing-qualifier
  why: >
    The canonical hard case. "Postgres stays for reporting only" neither confirms
    nor replaces "Atlas stores events in Postgres" — it carves the original down
    and leaves a remainder nobody has written. Auto-retiring here throws away the
    part that is still true; auto-storing leaves two beliefs that read as a
    contradiction. Only a human can say which.
  existing:
    content: Atlas stores events in Postgres
    category: decision
    subject: atlas
    age_days: 60
  incoming:
    content: Postgres stays for reporting only
    category: decision
    subject: atlas
  expect: escalate
  tags: [narrowing, decision, flagship]

- id: tool-split-by-work-type
  why: >
    Jira for work and Linear for bugs may be a migration in progress or a
    deliberate split. Both readings are ordinary, and the statements do not
    settle it.
  existing:
