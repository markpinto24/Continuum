# Crowded graphs: does the resolver judge the RIGHT memory?
#
# The resolver judges only the single top-scoring comparable candidate. In a
# graph holding several same-category memories about different entities, a new
# fact with no subject competes on cosine alone — if the wrong entity scores
# highest, the real contradiction is never judged. The resolution corpus cannot
# see this: every case there has exactly one existing memory.
#
# Each scenario runs twice, with subjects as the extractor usually leaves them
# (null) and as they should be. Only embeddings are used — no judge calls.
# `target` is the index in `graph` of the memory the incoming fact contradicts.

- id: three-client-budgets
  graph:
    - {content: "Acme's budget is capped at 5k per month", category: constraint, subject: acme}
    - {content: "Globex's budget is capped at 7k per month", category: constraint, subject: globex}
    - {content: "Initech's budget is capped at 3k per month", category: constraint, subject: initech}
  incoming: {content: "Globex's budget is now capped at 9k per month", category: constraint, subject: globex}
  target: 1

- id: three-service-owners
  graph:
    - {content: "Sara owns the billing service", category: person, subject: billing-service}
    - {content: "Raj owns the search service", category: person, subject: search-service}
    - {content: "Mei owns the payments service", category: person, subject: payments-service}
  incoming: {content: "Tom now owns the search service", category: person, subject: search-service}
  target: 1

- id: three-event-stores
  graph:
    - {content: "Atlas stores events in Postgres", category: decision, subject: atlas}
    - {content: "Orion stores events in DynamoDB", category: decision, subject: orion}
    - {content: "Vega stores events in Cassandra", category: decision, subject: vega}
  incoming: {content: "Orion now stores events in MongoDB", category: decision, subject: orion}
  target: 1

- id: one-project-two-decisions
  graph:
    - {content: "Atlas uses Redis for caching", category: decision, subject: atlas}
    - {content: "Atlas stores events in Postgres", category: decision, subject: atlas}
  incoming: {content: "Atlas stores events in MongoDB", category: decision, subject: atlas}
  target: 1

- id: clients-with-similar-preferences
