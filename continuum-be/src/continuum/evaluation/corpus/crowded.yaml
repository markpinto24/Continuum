  target: 1

- id: limits-across-tiers
  graph:
    - {content: "The free tier is limited to 10 requests per second", category: constraint, subject: api}
    - {content: "The pro tier is limited to 100 requests per second", category: constraint, subject: api}
    - {content: "Enterprise is limited to 1000 requests per second", category: constraint, subject: api}
  incoming: {content: "The pro tier is now limited to 200 requests per second", category: constraint, subject: api}
  target: 1
