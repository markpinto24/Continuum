    - {content: "Globex prefers a weekly status call", category: preference, subject: globex}
    - {content: "Initech prefers email updates", category: preference, subject: initech}
  incoming: {content: "Globex now prefers written async updates instead of calls", category: preference, subject: globex}
  target: 1

- id: deadlines-across-projects
  graph:
