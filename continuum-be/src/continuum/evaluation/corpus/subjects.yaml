# Labelled subject pairs — when do two slugs name one thing? (FINDINGS §13)
#
# meet: true   a statement about one can replace or contradict a statement about
#              the other, because they name the same thing. Kept apart, a change
#              filed under one never reaches the belief filed under the other —
#              the stale belief stays and nobody is asked.
# meet: false  two things a person can have at once (two people, two topics).
#              Meeting costs a judge call, and with an over-eager judge a
#              false dispute.
# names: true  memories write these with a capital ("Sara", "Kubernetes", "the
#              UI"). Names match by spelling only, whatever their meaning.
#
# Left out on purpose: alternatives for one slot (coffee / tea, postgres /
# mongodb, car / bike). Whether they should meet depends on the slot — "switched
# from coffee to tea" replaces, "likes coffee; likes tea" does not — so no
# single label is honest. Meeting costs them only a judge call either way.
#
# Cases tagged held-out were labelled before they were first embedded, and are
# not used to set the threshold. Three were seen while exploring (tag
# seen-in-exploration); the others were not.

