# Alembic CLI configuration, for writing and inspecting migrations:
#
#   uv run alembic revision --autogenerate -m "add teams"   # after editing db/models.py
#   uv run alembic upgrade head                              # the API also does this on start
#   uv run alembic current / history / downgrade -1
#
# The database comes from DATABASE_URL (see config.py), never from this file, so
# the CLI and the running API cannot point at different databases. The API does
# not read this file at all: it configures Alembic in code (db/engine.py).

[alembic]
script_location = %(here)s/src/continuum/db/migrations
# Dated filenames sort in the order they were written.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

[post_write_hooks]
# Keep autogenerated migrations in the project's style (and under 100 columns).
hooks = ruff_format, ruff
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME
ruff.type = exec
ruff.executable = %(here)s/.venv/bin/ruff
ruff.options = check --fix --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
