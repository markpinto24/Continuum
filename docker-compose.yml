# Full stack: Qdrant + the Continuum API + the web UI. Ollama runs on the HOST.
#
#   docker compose up -d --build        # from the repo root
#
# That is the only command, given a running Ollama on the host. The `models`
# job asks that Ollama to pull whatever models are configured, the Qdrant
# collection is created (and re-embedded after a model change) by the API's own
# lifespan hook, and the API waits for both before it starts.
#
# Why Ollama is not a container: a containerised Ollama keeps its own copy of
# every model. On a machine that already runs Ollama natively that is pure
# duplication — here it was a 5.5 GB image plus a 6.1 GB volume holding the same
# qwen2.5 and bge-m3 the host already had. The containers reach the host daemon
# through `host.docker.internal`.
#
# Requires Ollama on the host to listen beyond loopback (the Linux installer's
# default, `*:11434`). If yours binds 127.0.0.1 only, set OLLAMA_HOST=0.0.0.0
# for the ollama service. Point OLLAMA_URL elsewhere to use a different daemon.
#
# This file lives at the repo root, not inside continuum-be/, because it is a
# whole-stack concern: `api` and `web` are built from sibling directories.

name: continuum

services:
  qdrant:
    # Pinned conservatively. qdrant-client is 1.19.x; bump this tag to match
    # once you have confirmed the tag exists in your registry.
    image: qdrant/qdrant:v1.12.4
    container_name: continuum-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + dashboard -> http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_CORS: "true"
    healthcheck:
      # The Qdrant image is distroless - no curl, no shell utilities. Its own
      # binary can run a healthcheck against the gRPC port instead.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot job: make sure the host's Ollama has the configured models, then
  # exit. Uses Ollama's own pull API from an 8 MB alpine image instead of the
  # 5.5 GB ollama image — it only needs to send two HTTP requests. A model that
  # is already present returns immediately. The API waits for this to succeed.
  models:
    image: alpine:latest
    container_name: continuum-models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if ! wget -qO- -T 10 "$${OLLAMA_URL}/api/version" >/dev/null; then
          echo "Cannot reach Ollama at $${OLLAMA_URL}."
          echo "Is it running on the host, and listening beyond 127.0.0.1?"
          exit 1
        fi
        for model in "$${LLM_MODEL}" "$${EMBEDDING_MODEL}"; do
          echo "ensuring $${model} ..."
          result=$$(wget -qO- -T 3600 --header="Content-Type: application/json" \
            --post-data="{\"model\":\"$${model}\",\"stream\":false}" \
            "$${OLLAMA_URL}/api/pull")
          case "$${result}" in
            *success*) echo "  $${model}: ready" ;;
            *) echo "  $${model}: pull failed: $${result}"; exit 1 ;;
          esac
        done
        echo "models ready"
    restart: "no"

  api:
    build:
      # The build context is the backend project, so the Dockerfile's
      # `COPY pyproject.toml uv.lock README.md ./` still resolves and
      # continuum-be/.dockerignore still applies.
      context: ./continuum-be
      dockerfile: Dockerfile
    container_name: continuum-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      models:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ENVIRONMENT: docker
      DEBUG: "false"
      # Qdrant by service name on the compose network; Ollama on the host.
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-continuum_memories}
      LLM_BASE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}/v1
      LLM_API_KEY: ollama
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      EMBEDDING_BASE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}/v1
      EMBEDDING_API_KEY: ollama
      # bge-m3 since Phase 5 (FINDINGS §1, §8). Switching model is safe: the
      # api re-embeds every memory into a per-model collection on startup.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      DECAY_ENABLED: ${DECAY_ENABLED:-true}
      DECAY_INTERVAL_MINUTES: ${DECAY_INTERVAL_MINUTES:-360}
    # Anything in a repo-root .env overrides the defaults above - handy for
    # pointing the LLM at Groq or vLLM instead of the host's Ollama.
    env_file:
      - path: .env
        required: false

  web:
    build:
      context: ./continuum-fe
      dockerfile: Dockerfile
    container_name: continuum-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    # No VITE_API_URL: the bundle calls same-origin /api and nginx proxies it to
    # the api service. Baking an absolute URL into the build would tie the image
    # to one deployment - and Vite inlines env vars at build time, so it could
    # not be overridden at run time anyway.

volumes:
  qdrant_storage:
